[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "student-rocket-workbench"
version = "0.1.0"
description = "Reproducible rocket flight, engine, IMU-estimation, and BOM tools"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
simulation = ["rocketpy>=1.11,<2"]
engine = ["rocketcea>=1.2.1,<2"]
analysis = ["numpy>=2,<3", "matplotlib>=3.9,<4"]
cad = ["trimesh>=4,<5"]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
rocket-workbench = "rocket_workbench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
